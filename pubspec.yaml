name: anjar_boutique_bot
description: Anjar Boutique product photo -> branded post + caption generator
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  image: ^4.2.0
  cupertino_icons: ^1.0.8
  onnxruntime: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/background_template.png
    - assets/models/u2net.onnx
