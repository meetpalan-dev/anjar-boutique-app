name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download background-removal model
        run: |
          mkdir -p assets/models
          curl -L -o assets/models/u2net.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net.onnx

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Android platform files
        run: flutter create . --platforms=android --org com.anjarboutique --project-name anjar_boutique_bot

      - name: Bump Android compileSdk
        run: |
          find android -name "build.gradle*" -path "*/app/*" | xargs sed -i \
            -e 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 35/' \
            -e 's/compileSdk flutter\.compileSdkVersion/compileSdk 35/' \
            -e 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 35/'

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anjar-boutique-apk
          path: build/app/outputs/flutter-apk/app-release.apk
