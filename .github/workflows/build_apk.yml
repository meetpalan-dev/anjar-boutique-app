name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download background-removal model
        run: |
          mkdir -p assets/models
          curl -L -o assets/models/u2net.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net.onnx

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Android platform files
        run: flutter create . --platforms=android --org com.anjarboutique --project-name anjar_boutique_bot

      - name: Bump Android compileSdk
        run: |
          sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          echo "----- build.gradle.kts after edit -----"
          cat android/app/build.gradle.kts

      - name: Force compileSdk 36 via Gradle init script
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compileSdk.init.gradle.kts << 'EOF'
          allprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.gradle.BaseExtension> {
                      compileSdkVersion(36)
                  }
              }
          }
          EOF
          echo "----- init script -----"
          cat ~/.gradle/init.d/compileSdk.init.gradle.kts

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anjar-boutique-apk
          path: build/app/outputs/flutter-apk/app-release.apk
